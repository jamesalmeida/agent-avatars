name: Release

# Publish to npm when a GitHub release is published (tag 0.1.0 or v0.1.0),
# or by hand from the Actions tab (Run workflow). Publishes the version in
# package.json. Auth: npm Trusted Publishing (set on the package's npm
# settings page: GitHub Actions, this repo, release.yml), no token needed.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm publish --provenance
